[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "andrew-family-concierge-agent"
version = "1.0.0"
description = "Personal Family Meal & Wellness Command Center Agent built with Google ADK for the L200 Capstone."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
  {name = "Andrew", email = "placeholder-owner@example.com"}
]
dependencies = [
  "google-adk>=1.18.0",
  "google-genai>=1.10.0",
  "pydantic>=2.7.0",
  "python-json-logger>=2.0.7",
  "opentelemetry-api>=1.25.0",
  "opentelemetry-sdk>=1.25.0",
  "opentelemetry-exporter-gcp-trace>=1.7.0",
  "google-cloud-secret-manager>=2.20.0",
  "google-cloud-dlp>=3.18.0",
  "google-cloud-logging>=3.10.0",
  "google-cloud-discoveryengine>=0.11.14",
  "sqlalchemy>=2.0.30",
  "aiosqlite>=0.20.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
include = ["concierge_agent*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
