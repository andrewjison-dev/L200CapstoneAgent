name: AgentOps CI & Golden Dataset Evaluation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests-and-eval-gate:
    name: Unit Tests, Secret Audit & Golden Evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit & Security Test Suite
        run: pytest -v

      - name: Run Golden Dataset Regression Evaluation Gate (100% Required)
        run: python -m evals.run_evaluation

  terraform-iac-check:
    name: Validate Terraform IaC Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Check Terraform Formatting
        working-directory: terraform
        run: terraform fmt -check
